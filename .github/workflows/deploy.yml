name: deploy

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Build
        run: |
          pip install --upgrade pip build
          echo "hatchling==1.29.0" > "$RUNNER_TEMP/build-constraints.txt"
          PIP_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt" PIP_BUILD_CONSTRAINT="$RUNNER_TEMP/build-constraints.txt" python -m build -s -w
          ls -l dist/
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  pypi-publish:
    if: false
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
